

# The permissions the Konflux reader identity needs in the Konflux
# namespace the app reads (-namespace / KONFLUX_NAMESPACE). Bind them to
# whatever identity the mounted reader kubeconfig holds: a User, a Group,
# or a ServiceAccount whose token kubeconfig you exported.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-readiness-konflux-reader
  # Must live in the Konflux namespace the app reads.
  namespace: art-quay-tenant
rules:
  - apiGroups: ["appstudio.redhat.com"]
    resources: ["snapshots", "releases"]
    verbs: ["list"]
  - apiGroups: ["results.tekton.dev"]
    resources: ["results", "records"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-readiness-konflux-reader
  namespace: art-quay-tenant
subjects:
  # Replace with the reader kubeconfig's identity, e.g.:
  #   - kind: User
  #     name: <user>
  #   - kind: Group
  #     name: <group>
  - kind: ServiceAccount
    name: <reader-service-account>
    namespace: <app-namespace>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-readiness-konflux-reader
